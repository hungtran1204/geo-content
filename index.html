    <script>
const SOURCE_MD = "guide_content_seo_aeo_geo_zero_click.md";
const EMBEDDED_MARKDOWN = "# GUIDE TỔNG\n# Content Blog thích nghi với SEO, AEO, GEO \u0026 Zero Click\n\n\u003e **Mục tiêu tài liệu:** Training đội content creative chuyển từ cách viết blog SEO truyền thống sang cách xây dựng nội dung có khả năng được AI/search engine hiểu, trích xuất, trích dẫn và vẫn tạo giá trị thật cho người đọc.\n\n---\n\n## Case study xuyên suốt\n\n| Hạng mục | Nội dung |\n|---|---|\n| Base article | **Best Father’s Day Quotes** |\n| Chủ đề | Tổng hợp và hướng dẫn chọn câu quote cho Ngày của Cha |\n| User need chính | Tìm câu quote phù hợp để dùng ngay cho card, caption, tin nhắn, bài đăng social hoặc quà tặng cá nhân hóa |\n| Mục tiêu content | Không chỉ liệt kê quote, mà giúp user chọn đúng quote theo cảm xúc, người nhận và nơi sử dụng |\n\n---\n\n# PHẦN 1. VẤN ĐỀ / THỰC TRẠNG\n\n## 1. Vì sao chúng ta phải thay đổi?\n\nHành vi tìm kiếm của người dùng đã thay đổi mạnh. Người dùng không còn muốn mở nhiều bài viết, đọc dài và tự tổng hợp. Họ muốn nhận được **câu trả lời nhanh, đúng ngữ cảnh, dễ áp dụng ngay**.\n\nTrước đây, content blog chủ yếu cạnh tranh để được Google xếp hạng và kéo click. Hiện nay, Google, AI Overview, ChatGPT, Perplexity, Gemini và các answer engine có xu hướng **đọc nội dung, tổng hợp lại và trả lời trực tiếp cho người dùng**.\n\n\u003e **Vấn đề cốt lõi:**  \n\u003e Nếu content không được AI/search engine chọn làm nguồn trả lời, content gần như biến mất khỏi hành trình tìm kiếm của người dùng.\n\n---\n\n## 2. Người dùng đã thay đổi cách tìm kiếm như thế nào?\n\n### Trước đây\n\nNgười dùng thường search keyword ngắn:\n\n- Father’s Day quotes\n- Best dad quotes\n- Funny Father’s Day quotes\n\nSau đó họ click nhiều bài, đọc, chọn câu phù hợp.\n\n### Hiện nay\n\nNgười dùng tìm kiếm cụ thể hơn:\n\n- Best Father’s Day quotes for a loving dad\n- Short Father’s Day quotes for Instagram caption\n- Funny Father’s Day quotes from daughter\n- Emotional Father’s Day message for a dad who passed away\n- What to write in a Father’s Day card\n- Father’s Day quote for a personalized shirt or mug\n\n\u003e **Insight:**  \n\u003e Người dùng không chỉ tìm “quote”. Họ tìm **quote phù hợp với tình huống sử dụng**.\n\n---\n\n## 3. Công cụ tìm kiếm đã thay đổi cách đưa kết quả như thế nào?\n\nSearch engine không còn chỉ là nơi hiển thị danh sách link. Nó đang chuyển thành **answer engine**.\n\n| Trước đây | Hiện nay |\n|---|---|\n| Google hiển thị 10 blue links | AI Overview có thể trả lời ngay trên SERP |\n| Website thắng khi rank cao | Website thắng khi được chọn làm nguồn trả lời |\n| User click để đọc câu trả lời | User có thể nhận câu trả lời mà không click |\n| Cạnh tranh bằng page ranking | Cạnh tranh bằng answer selection |\n\n\u003e **Mục tiêu mới:**  \n\u003e Không chỉ rank bài viết, mà phải được chọn làm nguồn cho câu trả lời.\n\n---\n\n## 4. Tiêu chí “content phù hợp” đã thay đổi\n\nContent phù hợp trong bối cảnh mới không chỉ là bài dài, có keyword và đầy đủ thông tin. Nội dung phù hợp phải có khả năng:\n\n1. Trả lời trực tiếp câu hỏi của người dùng.\n2. Rõ ràng, dễ hiểu, ít mơ hồ.\n3. Có cấu trúc để AI dễ bóc tách.\n4. Mỗi đoạn có thể đứng độc lập.\n5. Đúng intent và đúng ngữ cảnh sử dụng.\n6. Có đủ chiều sâu để người đọc thật thấy giá trị.\n7. Có dấu hiệu tin cậy: kinh nghiệm, logic, ví dụ, dữ liệu hoặc insight.\n\n\u003e **Định nghĩa mới về content tốt:**  \n\u003e Content tốt không còn là “bài viết hay”, mà là **hệ thống câu trả lời có cấu trúc, có thể được AI hiểu, trích xuất và người đọc áp dụng ngay**.\n\n---\n\n## 5. Vì sao content kiểu cũ dễ thất bại?\n\nContent kiểu cũ thường gặp các lỗi sau:\n\n- Intro dài, không trả lời ngay.\n- H2 chung chung như “Introduction”, “Overview”, “Conclusion”.\n- Viết theo keyword, không theo câu hỏi.\n- Một đoạn chứa quá nhiều ý.\n- Thiếu ví dụ theo từng tình huống cụ thể.\n- Nội dung dài nhưng không có information gain.\n- CTA đặt cuối bài, không gắn với intent.\n\n### Ví dụ với “Best Father’s Day Quotes”\n\nNếu bài chỉ có các section:\n\n- 100 Best Father’s Day Quotes\n- Happy Father’s Day Quotes\n- Funny Father’s Day Quotes\n- Inspirational Father’s Day Quotes\n\nthì bài có thể vẫn hữu ích, nhưng rất dễ generic. AI có thể lấy quote từ nhiều nguồn khác, còn người dùng không có lý do mạnh để click hoặc ở lại.\n\n\u003e **Cách tiếp cận mới:**  \n\u003e Bài cần chuyển từ “danh sách quotes” thành “hệ thống quote theo intent sử dụng”.\n\n---\n\n# PHẦN 2. GIẢI PHÁP TỔNG QUAN\n\n## 1. Thay đổi tư duy content\n\nTeam content cần chuyển từ:\n\n\u003e Viết bài blog để lên top.\n\nsang:\n\n\u003e Thiết kế câu trả lời có cấu trúc để được AI chọn, người dùng tin và có thể hành động.\n\n---\n\n## 2. Các yếu tố cần áp dụng ngay\n\n### 2.1. Answer-first\n\nMỗi bài và mỗi section phải trả lời ngay câu hỏi chính trước khi giải thích.\n\n**Không nên mở đầu kiểu:**\n\n\u003e Father’s Day is a special occasion celebrated around the world...\n\n**Nên mở đầu kiểu:**\n\n\u003e The best Father’s Day quotes are short, heartfelt lines that express gratitude, love, and respect for a father. Choose the quote based on how you plan to use it: a card, Instagram caption, gift message, or personal tribute.\n\n---\n\n### 2.2. Intent-based structure\n\nKhông xây bài theo keyword đơn lẻ. Xây bài theo nhóm nhu cầu:\n\n- Người cần quote ngắn.\n- Người cần quote cảm động.\n- Người cần quote hài hước.\n- Người cần quote từ con gái.\n- Người cần quote từ con trai.\n- Người cần quote cho người cha đã mất.\n- Người cần quote để in lên quà tặng.\n\n---\n\n### 2.3. Extractable content\n\nMỗi đoạn nên có khả năng bị trích xuất độc lập.\n\nMột đoạn tốt cần:\n\n- Có câu trả lời chính.\n- Không phụ thuộc đoạn trước.\n- Có ngữ cảnh đủ rõ.\n- Không quá dài.\n\n---\n\n### 2.4. Content layering\n\nMỗi phần nên có 2 lớp:\n\n| Layer | Vai trò | Đặc điểm |\n|---|---|---|\n| Answer Layer | Để AI/user hiểu nhanh | Ngắn, rõ, trả lời trực tiếp |\n| Value Layer | Để giữ người đọc | Insight, ví dụ, data, hướng dẫn áp dụng |\n\n---\n\n### 2.5. Information Gain\n\nKhông cần nhồi thông tin mới vào mọi đoạn. Nhưng bài cần có ít nhất một lớp giá trị khác biệt:\n\n- Cách chọn quote theo người nhận.\n- Cách chọn quote theo kênh sử dụng: card, caption, mug, shirt, blanket.\n- Dữ liệu nội bộ: nhóm quote nào được dùng nhiều nhất trong đơn hàng Father’s Day.\n- Insight từ review khách hàng.\n- Framework chọn quote theo cảm xúc: heartfelt, funny, proud, memorial, simple.\n\n---\n\n### 2.6. Entity, thuộc tính và mối quan hệ\n\nEntity không nên được hiểu là “nhồi thực thể”. Team cần dùng entity để giúp AI hiểu chủ đề sâu hơn.\n\n| Nhóm | Ví dụ |\n|---|---|\n| Entity chính | Father’s Day, dad, daughter, son, husband, grandpa |\n| Format | quote, message, caption, card wording |\n| Use case | gift, mug, shirt, blanket, poster |\n| Emotion | love, gratitude, respect, memory, humor |\n| Relationship | quote dành cho ai, dùng ở đâu, mang cảm xúc gì |\n\n---\n\n### 2.7. EEAT\n\nEEAT không nhất thiết phải viết dài hoặc tự xưng là chuyên gia. EEAT nên được thể hiện qua:\n\n- Cách phân loại quote hợp lý.\n- Gợi ý theo tình huống thật.\n- Ví dụ cụ thể.\n- Cảnh báo quote nào không nên dùng trong ngữ cảnh nhạy cảm.\n- Dữ liệu hoặc insight từ khách hàng nếu có.\n\n---\n\n### 2.8. CTA theo context\n\nCTA không nên spam cuối bài. CTA nên xuất hiện đúng lúc người dùng có nhu cầu tiếp theo.\n\n**Ví dụ sau phần “Father’s Day quotes for personalized gifts”:**\n\n\u003e If you want the quote to feel more personal, choose a short line that can fit naturally on a mug, shirt, blanket, or photo gift.\n\nSau đó mới dẫn sang sản phẩm liên quan.\n\n---\n\n# PHẦN 3. GUIDE CHI TIẾT THEO MODULE\n\n---\n\n# MODULE 1. CONTENT MINDSET\n\n## Mục tiêu\n\nGiúp team hiểu rằng content blog hiện nay không chỉ để người dùng đọc từ đầu đến cuối. Content còn được AI đọc, tách đoạn, tổng hợp và sử dụng làm câu trả lời.\n\n## Tư duy cần thay đổi\n\n| Tư duy cũ | Tư duy mới |\n|---|---|\n| Viết bài dài để đủ SEO | Viết answer assets |\n| Tập trung keyword | Tập trung intent |\n| Intro dẫn dắt dài | Trả lời ngay từ đầu |\n| Bài viết là đơn vị chính | Section/paragraph là đơn vị chính |\n| User đọc từ đầu đến cuối | AI scan, extract, summarize |\n\n## Framework: Answer Asset Mindset\n\nKhi viết, writer phải tự hỏi:\n\n- Người dùng đang hỏi gì?\n- Đoạn này trả lời câu hỏi nào?\n- Nếu AI lấy riêng đoạn này, nó có đủ nghĩa không?\n- Đoạn này có giúp người đọc hành động không?\n- Đoạn này có gì khác generic content ngoài kia không?\n\n## Ví dụ với “Best Father’s Day Quotes”\n\n**Cách nghĩ cũ:**\n\n\u003e Viết một bài list 100 câu quote về Father’s Day.\n\n**Cách nghĩ mới:**\n\n\u003e Thiết kế một bài giúp người dùng chọn đúng quote cho từng người cha, từng cảm xúc và từng nơi sử dụng.\n\n## Output kỳ vọng\n\nBài không chỉ có list quote, mà phải có các phần như:\n\n- Best short Father’s Day quotes\n- Heartfelt Father’s Day quotes\n- Funny Father’s Day quotes\n- Father’s Day quotes from daughter\n- Father’s Day quotes from son\n- Father’s Day quotes for a husband\n- Father’s Day quotes for grandpa\n- Father’s Day quotes for a dad in heaven\n- Father’s Day quotes for cards\n- Father’s Day quotes for personalized gifts\n\n## Checklist Module 1\n\n- [ ] Bài đang viết cho user thật hay chỉ viết cho keyword?\n- [ ] Topic đã được biến thành các câu hỏi cụ thể chưa?\n- [ ] Mỗi section có một mục tiêu rõ không?\n- [ ] Mỗi đoạn có thể đứng độc lập không?\n- [ ] Có phần nào viết chỉ để đủ chữ không?\n- [ ] Nếu AI lấy một đoạn, đoạn đó có đủ nghĩa không?\n\n---\n\n# MODULE 2. INTENT MAPPING\n\n## Mục tiêu\n\nBiến keyword thành bản đồ nhu cầu tìm kiếm thật của người dùng.\n\n## Vì sao quan trọng?\n\nKeyword “Best Father’s Day Quotes” nghe có vẻ đơn giản, nhưng bên trong có nhiều intent nhỏ. Nếu không map intent, bài sẽ chỉ là một danh sách quote chung chung.\n\n## Framework: Topic → Intent → Question → Content Block\n\n### Bước 1. Xác định topic chính\n\n**Topic:** Best Father’s Day Quotes\n\n### Bước 2. Xác định các intent chính\n\n| Intent | Người dùng cần gì? | Ví dụ câu hỏi |\n|---|---|---|\n| Definition | Hiểu nhanh loại quote phù hợp | What makes a good Father’s Day quote? |\n| Usage / Context | Dùng quote trong tình huống nào | What should I write in a Father’s Day card? |\n| Emotional | Tìm quote theo cảm xúc | What is a heartfelt Father’s Day quote? |\n| Relationship | Tìm quote theo người gửi/người nhận | Best Father’s Day quotes from daughter |\n| Format | Tìm quote theo kênh dùng | Short Father’s Day captions for Instagram |\n| Problem-solving | Không biết viết gì | What can I say instead of Happy Father’s Day? |\n| Commercial support | Dùng quote cho quà tặng | Father’s Day quotes for personalized gifts |\n\n## Cách áp dụng\n\n**Brief chưa tốt:**\n\n\u003e Keyword: Best Father’s Day Quotes  \n\u003e Word count: 1500 words\n\n**Brief đúng:**\n\n\u003e Topic: Best Father’s Day Quotes  \n\u003e Main intent: Người dùng muốn tìm và chọn quote phù hợp để dùng ngay.  \n\u003e Secondary intents: card, caption, gift message, emotional quote, funny quote, daughter/son quote, memorial quote.  \n\u003e Conversion intent: quote dùng cho personalized gift.\n\n## Lỗi thường gặp\n\n- Chỉ gom quote theo tính từ: best, funny, short, emotional.\n- Không phân loại theo người dùng thật: daughter, son, wife, child, grandchild.\n- Không có phần giúp chọn quote.\n- Không có phần quote dùng cho sản phẩm hoặc quà tặng.\n\n## Checklist Module 2\n\n- [ ] User đang hỏi gì?\n- [ ] Có chia topic thành các intent nhỏ chưa?\n- [ ] Có đủ câu hỏi theo người dùng thật chưa?\n- [ ] Có intent theo cảm xúc không?\n- [ ] Có intent theo người gửi/người nhận không?\n- [ ] Có intent theo nơi sử dụng không?\n- [ ] Có intent hỗ trợ mua/quà tặng không?\n- [ ] Có intent nào bị dư hoặc lệch pain point không?\n\n---\n\n# MODULE 3. CONTENT STRUCTURE FRAMEWORK\n\n## Mục tiêu\n\nTạo cấu trúc bài dễ đọc, dễ scan, dễ được AI extract.\n\n## Nguyên tắc\n\n1. Intro phải trả lời ngay.\n2. H2 nên là câu hỏi hoặc nhu cầu cụ thể.\n3. Mỗi H2 xử lý một intent.\n4. Mỗi section có answer block trước, list quote sau.\n5. Kết bài phải giúp chọn hành động tiếp theo.\n\n## Framework cấu trúc chuẩn\n\n### H1 đề xuất\n\n\u003e Best Father’s Day Quotes for Cards, Captions, and Personalized Gifts\n\nH1 này tốt hơn “Best Father’s Day Quotes” vì nó mở rõ ngữ cảnh sử dụng.\n\n### Intro answer block\n\n\u003e The best Father’s Day quotes are short, meaningful lines that express love, gratitude, respect, or humor. To choose the right quote, match it with your relationship, emotional tone, and where you plan to use it, such as a card, Instagram caption, or personalized gift.\n\n### Suggested H2 structure\n\n1. What Makes a Good Father’s Day Quote?\n2. Best Short Father’s Day Quotes\n3. Heartfelt Father’s Day Quotes\n4. Funny Father’s Day Quotes\n5. Father’s Day Quotes from Daughter\n6. Father’s Day Quotes from Son\n7. Father’s Day Quotes for Husband\n8. Father’s Day Quotes for Grandpa\n9. Father’s Day Quotes for a Dad in Heaven\n10. Father’s Day Quotes for Cards\n11. Father’s Day Quotes for Instagram Captions\n12. Father’s Day Quotes for Personalized Gifts\n13. How to Choose the Right Father’s Day Quote\n14. Father’s Day Quotes FAQ\n\n## Lỗi thường gặp\n\n- Đưa list quote ngay nhưng không có hướng dẫn chọn.\n- Section quá chung, không khớp intent cụ thể.\n- Không có phần cho card/caption/gift.\n- Không có FAQ xử lý long-tail questions.\n\n## Checklist Module 3\n\n- [ ] H1 có rõ topic không?\n- [ ] H1 có thêm context sử dụng không?\n- [ ] Intro trả lời ngay chưa?\n- [ ] Mỗi H2 có gắn với một intent không?\n- [ ] H2 có giống câu hỏi user search không?\n- [ ] Mỗi section có một mục tiêu rõ không?\n- [ ] Có section giúp user chọn/hành động không?\n- [ ] Có section nào chung chung cần xóa/gộp không?\n\n---\n\n# MODULE 4. ANSWER WRITING FRAMEWORK\n\n## Mục tiêu\n\nChuẩn hóa cách viết từng đoạn để AI dễ chọn và người dùng dễ hiểu.\n\n## Framework: Direct Answer → Context → Example → Action\n\nMỗi section nên bắt đầu bằng một answer block gồm 3–5 câu hoặc 1 đoạn ngắn + bullet.\n\n| Thành phần | Vai trò |\n|---|---|\n| Direct Answer | Trả lời ngay câu hỏi |\n| Context | Nói rõ khi nào áp dụng |\n| Example | Đưa ví dụ cụ thể |\n| Action | Gợi ý người đọc nên làm gì tiếp |\n\n## Ví dụ section\n\n### H2: What Makes a Good Father’s Day Quote?\n\n**Answer block chuẩn:**\n\n\u003e A good Father’s Day quote should match your relationship with your dad, the emotion you want to express, and the place where the quote will appear. Short quotes work best for captions and gifts, while longer heartfelt messages are better for cards or personal letters.\n\n**Mở rộng:**\n\n- Use a short quote for mugs, shirts, captions, or photo gifts.\n- Use a heartfelt quote for cards, letters, or tribute posts.\n- Use a funny quote only when it matches your dad’s personality.\n- Avoid overly generic quotes if the message is meant to feel personal.\n\n## Ví dụ chưa tốt\n\n\u003e Father’s Day is a meaningful occasion to celebrate dads around the world. Many people choose quotes because quotes are a great way to express emotion and show appreciation.\n\n**Vấn đề:**\n\n- Không trả lời rõ “what makes a good quote”.\n- Nói chung chung.\n- Không có tiêu chí chọn.\n\n## Checklist Module 4\n\n- [ ] Câu đầu đã trả lời thẳng chưa?\n- [ ] Đoạn này trả lời một câu hỏi cụ thể không?\n- [ ] Có nói rõ khi nào áp dụng không?\n- [ ] Có ví dụ/tiêu chí chọn không?\n- [ ] Có quá 4–5 câu không?\n- [ ] Có câu nào vòng vo không?\n- [ ] Tách riêng đoạn này vẫn hiểu không?\n- [ ] AI có thể lấy đoạn này làm câu trả lời không?\n\n---\n\n# MODULE 5. CONTENT LAYERING\n\n## Mục tiêu\n\nGiải quyết mâu thuẫn: content phải ngắn để AI chọn, nhưng cũng phải đủ sâu để người đọc thấy giá trị.\n\n## Framework: Layer 1 + Layer 2\n\n| Layer | Dành cho | Đặc điểm |\n|---|---|---|\n| Layer 1: Answer Layer | AI/search engine và user muốn câu trả lời nhanh | 2–4 câu, trực tiếp, extractable |\n| Layer 2: Value Layer | Người đọc thật sau khi đã click | Insight, ví dụ, so sánh, dữ liệu, hướng dẫn áp dụn s work best for personalized gifts because they are easier to read on mugs, shirts, blankets, and photo frames.\n\n## Checklist Module 12\n\n- [ ] FAQ có phải câu hỏi user thật không?\n- [ ] Câu trả lời có ngắn không?\n- [ ] Câu đầu có trả lời trực tiếp không?\n- [ ] Có FAQ về card/caption/gift không?\n- [ ] Có FAQ theo relationship không?\n- [ ] Có FAQ cho tình huống nhạy cảm không?\n- [ ] FAQ có lặp lại y nguyên phần trên không?\n- [ ] FAQ có thể được AI extract không?\n\n---\n\n# MODULE 13. CONTENT BRIEF TEMPLATE\n\n## Mục tiêu\n\nChuẩn hóa đầu vào cho writer để tránh viết lan man.\n\n## Template brief chuẩn\n\n| Trường | Nội dung mẫu |\n|---|---|\n| Topic | Best Father’s Day Quotes |\n| Main Keyword | best Father’s Day quotes |\n| Primary Intent | Người dùng muốn tìm quote phù hợp để dùng ngay cho Father’s Day |\n| Target Audience | Người đang tìm lời chúc, caption hoặc quote để gửi cho cha, chồng, ông, stepdad hoặc dùng trên quà tặng cá nhân hóa |\n| Content Angle | Không chỉ liệt kê quote. Bài phải giúp người đọc chọn đúng quote theo cảm xúc, mối quan hệ và nơi sử dụng |\n| CTA Requirement | CTA phải gắn với section quà tặng cá nhân hóa, không sales chung chung |\n\n## Secondary intents\n\n- Quote ngắn\n- Quote cảm động\n- Quote hài hước\n- Quote từ con gái\n- Quote từ con trai\n- Quote cho chồng\n- Quote cho ông\n- Quote cho cha đã mất\n- Quote cho card\n- Quote cho caption\n- Quote cho personalized gift\n\n## Required modules\n\n- Answer-first intro\n- Quote categories by intent\n- How to choose the right quote\n- Quote use-case table\n- Personalized gift section\n- FAQ\n\n## Information Gain Requirement\n\nThêm ít nhất một trong các lớp sau:\n\n- Internal customer insight\n- Product-use recommendation\n- Quote selection framework\n- Quote length guidance for personalized gifts\n- Review-based insight\n\n## Checklist Module 13\n\n- [ ] Brief có primary intent rõ không?\n- [ ] Brief có secondary intents không?\n- [ ] Brief có target audience không?\n- [ ] Bri ss, and where the quote will be used.\n\n## 5. Decision Table\n\n| Situation | Best quote style | Recommended format |\n|---|---|---|\n| Card | Heartfelt | 1 quote + 1 personal message |\n| Instagram | Short / funny | 1 short quote + simple caption |\n| Mug | Short / warm | Under 8–12 words |\n| Shirt | Funny / proud | Bold, easy-to-read quote |\n| Blanket | Emotional / family | Longer warm quote |\n| Memorial post | Gentle / remembrance | Respectful tribute quote |\n\n## 6. CTA Example\n\n\u003e After choosing a quote, you can make it more personal by adding it to a Father’s Day mug, shirt, blanket, or photo gift that matches your dad’s personality.\n\n---\n\n# PHẦN 5. NGUYÊN TẮC CUỐI CHO TEAM CONTENT\n\n## 1. Không viết dài chỉ để dài\n\nĐộ dài không phải mục tiêu. Đúng intent, rõ answer, có value layer mới là mục tiêu.\n\n## 2. Không nhồi Information Gain, EEAT, Entity vào mọi đoạn\n\nCác yếu tố này cần thiết nhưng phải đặt đúng chỗ. Answer layer phải ngắn và rõ. Value layer mới là nơi bổ sung insight, entity depth, data và experience.\n\n## 3. Mỗi section phải trả lời một câu hỏi thật\n\nNếu section không trả lời câu hỏi nào, nên xóa hoặc gộp.\n\n## 4. Mỗi đoạn phải có khả năng được trích xuất\n\nĐoạn tốt là đoạn đứng một mình vẫn có nghĩa.\n\n## 5. Blog phải vừa phục vụ AI vừa phục vụ người đọc thật\n\nAI cần answer rõ. Người đọc cần ví dụ, insight, hướng dẫn và bước tiếp theo.\n\n---\n\n# KẾT LUẬN\n\nContent trong thời đại Zero Click không thể chỉ là bài viết dài tối ưu keyword. Team content cần chuyển sang tư duy thiết kế **answer assets**: mỗi bài là một hệ thống câu trả lời có cấu trúc, mỗi section xử lý một intent, mỗi đoạn có thể được AI hiểu và trích xuất.\n\nVới bài **Best Father’s Day Quotes**, mục tiêu không phải chỉ là liệt kê nhiều quote nhất. Mục tiêu đúng là giúp người đọc **chọn quote phù hợp nhất theo người nhận, cảm xúc, kênh sử dụng và hành động tiếp theo**.\n\nĐó là cách content vừa có khả năng được AI/search engine chọn, vừa có giá trị thật function splitDocument(markdown) {
  const lines = markdown.split("\n");
  const titleLines = [];
  let startIndex = 0;

  while (startIndex < lines.length && /^#\s+/.test(lines[startIndex])) {
    titleLines.push(lines[startIndex].replace(/^#\s+/, "").trim());
    startIndex += 1;
  }

  const sections = [];
  let current = null;

  for (let i = startIndex; i < lines.length; i += 1) {
    const line = lines[i];
    const h1 = line.match(/^#\s+(.+)$/);
    const isMajor = h1 && /^(PHẦN|MODULE|KẾT LUẬN)/i.test(h1[1].trim());

    if (isMajor) {
      if (current) sections.push(current);
      current = {
        title: h1[1].trim(),
        raw: [],
        type: getSectionType(h1[1].trim()),
        id: uniqueSlug(h1[1].trim(), sections.length),
      };
      continue;
    }

    if (!current) {
      current = {
        title: "Case study xuyên suốt",
        raw: [],
        type: "part",
        id: "case-study-xuyen-suot",
      };
    }
    current.raw.push(line);
  }

  if (current) sections.push(current);

  return {
    title: titleLines[1] || titleLines[0] || "Training Content Blog",
    subtitle:
      "Tài liệu trực quan hóa từ Markdown: học theo module, so sánh nhanh, mở ví dụ và checklist khi cần.",
    sections,
  };
}

function getSectionType(title) {
  if (/^MODULE/i.test(title)) return "module";
  if (/CHECKLIST/i.test(title) || /^PHẦN 4/i.test(title)) return "checklist";
  return "part";
}

function renderHero(parsed) {
  els.heroTitle.textContent = parsed.title;
  els.heroSubtitle.textContent = parsed.subtitle;
}

function renderMetrics(markdown, sections) {
  els.moduleCount.textContent = sections.filter((section) => section.type === "module").length;
  els.tableCount.textContent = String((markdown.match(/^\|.+\|$/gm) || []).length > 0
    ? countTables(markdown)
    : 0);
  els.checklistCount.textContent = String((markdown.match(/Checklist/gi) || []).length);
}

function countTables(markdown) {
  const lines = markdown.split("\n");
  let count = 0;
  let inTable = false;
  lines.forEach((line) => {
    const isTable = /^\|.+\|$/.test(line.trim());
    if (isTable && !inTable) count += 1;
    inTable = isTable;
  });
  return count;
}

function renderContent(sections) {
  els.content.innerHTML = "";
  const moduleLinks = sections
    .filter((section) => section.type === "module")
    .slice(0, 14)
    .map((section) => `<a href="#${section.id}">${escapeHtml(shortTitle(section.title))}</a>`)
    .join("");

  if (moduleLinks) {
    const map = document.createElement("section");
    map.className = "quick-map";
    map.innerHTML = moduleLinks;
    els.content.appendChild(map);
  }

  sections.forEach((section, index) => {
    const article = document.createElement("article");
    article.className = "training-section";
    article.dataset.type = section.type;
    article.id = section.id;
    article.dataset.searchText = normalizeSearch(`${section.title}\n${section.raw.join("\n")}`);

    const bodyHtml = markdownToHtml(section.raw.join("\n"), section.id);
    article.innerHTML = `
      <header class="section-head">
        <div class="section-kicker">
          <span class="section-badge">${labelForType(section.type)}</span>
          <span>${String(index + 1).padStart(2, "0")}</span>
        </div>
        <h2>${escapeHtml(section.title)}</h2>
      </header>
      <div class="section-body">${bodyHtml}</div>
    `;
    els.content.appendChild(article);
  });

  decorateDetails();
}

function renderToc(sections) {
  const links = [];
  sections.forEach((section) => {
    links.push(`<a class="toc-h1" href="#${section.id}">${escapeHtml(shortTitle(section.title))}</a>`);
    getLocalHeadings(section.raw.join("\n"), section.id).slice(0, 4).forEach((heading) => {
      links.push(
        `<a class="toc-h2" href="#${heading.id}">${escapeHtml(shortTitle(heading.text, 52))}</a>`
      );
    });
  });
  els.toc.innerHTML = links.join("");
}

function getLocalHeadings(markdown, prefix) {
  const used = new Map();
  return markdown
    .split("\n")
    .map((line) => line.match(/^(#{2,3})\s+(.+)$/))
    .filter(Boolean)
    .map((match) => {
      const text = match[2].trim();
      const id = `${prefix}-${makeUnique(slugify(text), used)}`;
      return { level: match[1].length, text, id };
    });
}

function markdownToHtml(markdown, prefix) {
  const lines = markdown.split("\n");
  const html = [];
  let paragraph = [];
  let list = null;
  let table = [];
  let quote = [];
  const used = new Map();

  const flushParagraph = () => {
    if (!paragraph.length) return;
    html.push(`<p>${inline(paragraph.join(" "))}</p>`);
    paragraph = [];
  };

  const flushList = () => {
    if (!list) return;
    html.push(`<${list.type}>${list.items.map(renderListItem).join("")}</${list.type}>`);
    list = null;
  };

  const flushTable = () => {
    if (!table.length) return;
    html.push(renderTable(table));
    table = [];
  };

  const flushQuote = () => {
    if (!quote.length) return;
    const text = quote.join(" ").trim();
    html.push(`<aside class="callout ${calloutClass(text)}">${inline(text)}</aside>`);
    quote = [];
  };

  lines.forEach((rawLine) => {
    const line = rawLine.trimEnd();
    const trimmed = line.trim();

    if (/^\|.+\|$/.test(trimmed)) {
      flushParagraph();
      flushList();
      flushQuote();
      table.push(trimmed);
      return;
    }
    flushTable();

    if (!trimmed) {
      flushParagraph();
      flushList();
      flushQuote();
      return;
    }

    if (/^---+$/.test(trimmed)) {
      flushParagraph();
      flushList();
      flushQuote();
      html.push('<div class="content-divider"></div>');
      return;
    }

    const heading = trimmed.match(/^(#{2,4})\s+(.+)$/);
    if (heading) {
      flushParagraph();
      flushList();
      flushQuote();
      const level = Math.min(heading[1].length + 1, 4);
      const text = heading[2].trim();
      const id = `${prefix}-${makeUnique(slugify(text), used)}`;
      html.push(`<h${level} id="${id}">${inline(text)}</h${level}>`);
      return;
    }

    const quoteMatch = trimmed.match(/^>\s?(.*)$/);
    if (quoteMatch) {
      flushParagraph();
      flushList();
      quote.push(quoteMatch[1]);
      return;
    }

    const unordered = trimmed.match(/^[-*]\s+(.+)$/);
    const ordered = trimmed.match(/^\d+\.\s+(.+)$/);
    if (unordered || ordered) {
      flushParagraph();
      flushQuote();
      const type = ordered ? "ol" : "ul";
      if (!list || list.type !== type) {
        flushList();
        list = { type, items: [] };
      }
      list.items.push((unordered || ordered)[1]);
      return;
    }

    paragraph.push(trimmed);
  });

  flushParagraph();
  flushList();
  flushTable();
  flushQuote();

  return html.join("");
}

function renderTable(rows) {
  const parsed = rows
    .map((row) => row.replace(/^\||\|$/g, "").split("|").map((cell) => cell.trim()))
    .filter((cells) => !cells.every((cell) => /^:?-{3,}:?$/.test(cell)));

  if (!parsed.length) return "";
  const [head, ...body] = parsed;
  return `
    <div class="table-wrap" role="region" aria-label="Bảng so sánh" tabindex="0">
      <table>
        <thead><tr>${head.map((cell) => `<th>${inline(cell)}</th>`).join("")}</tr></thead>
        <tbody>${body
          .map((row) => `<tr>${row.map((cell) => `<td>${inline(cell)}</td>`).join("")}</tr>`)
          .join("")}</tbody>
      </table>
    </div>
  `;
}

function renderListItem(item) {
  const task = item.match(/^\[\s?\]\s+(.+)$/);
  if (task) {
    return `<li class="task-li"><label><input type="checkbox" /> <span>${inline(task[1])}</span></label></li>`;
  }
  return `<li>${inline(item)}</li>`;
}

function decorateDetails() {
  document.querySelectorAll(".section-body").forEach((body) => {
    [...body.children].forEach((node) => {
      if (!/^H[234]$/.test(node.tagName)) return;
      const title = node.textContent.trim();
      const shouldCollapse = /ví dụ|example|checklist|faq|cta sai|cta đúng/i.test(title);
      if (!shouldCollapse) return;

      const details = document.createElement("details");
      details.className = /checklist/i.test(title) ? "checklist-card" : "example-card";
      details.id = node.id;
      if (/ví dụ tốt|ví dụ áp dụng đúng|faq tốt/i.test(title)) details.open = true;

      const summary = document.createElement("summary");
      summary.textContent = title;
      const wrapper = document.createElement("div");
      wrapper.className = "details-body";

      let cursor = node.nextElementSibling;
      while (cursor && !isSameOrHigherHeading(cursor, node)) {
        const next = cursor.nextElementSibling;
        wrapper.appendChild(cursor);
        cursor = next;
      }

      details.append(summary, wrapper);
      node.replaceWith(details);
    });
  });
}

function isSameOrHigherHeading(candidate, currentHeading) {
  if (!/^H[234]$/.test(candidate.tagName)) return false;
  return Number(candidate.tagName.slice(1)) <= Number(currentHeading.tagName.slice(1));
}

function bindUi() {
  document.querySelectorAll("[data-filter]").forEach((button) => {
    button.addEventListener("click", () => {
      document.querySelectorAll("[data-filter]").forEach((item) => item.classList.remove("active"));
      button.classList.add("active");
      state.activeFilter = button.dataset.filter;
      applyFilters();
    });
  });

  els.search.addEventListener("input", () => {
    state.query = normalizeSearch(els.search.value);
    applyFilters();
  });

  els.expandAll.addEventListener("click", () => {
    const details = [...document.querySelectorAll("details")];
    const shouldOpen = details.some((item) => !item.open);
    details.forEach((item) => {
      item.open = shouldOpen;
    });
    els.expandAll.textContent = shouldOpen ? "Đóng tất cả ví dụ" : "Mở tất cả ví dụ";
  });

  els.backTop.addEventListener("click", () => {
    document.querySelector("#top").scrollIntoView({ behavior: "smooth" });
  });

  window.addEventListener("scroll", () => {
    updateProgress();
    els.backTop.classList.toggle("is-visible", window.scrollY > 600);
  }, { passive: true });
}

function applyFilters() {
  document.querySelectorAll(".training-section").forEach((section) => {
    const typeMatch = state.activeFilter === "all" || section.dataset.type === state.activeFilter;
    const searchMatch = !state.query || section.dataset.searchText.includes(state.query);
    section.classList.toggle("is-hidden", !(typeMatch && searchMatch));
  });
}

function observeHeadings() {
  state.anchors = [...document.querySelectorAll(".training-section[id], .section-body h3[id], .section-body h4[id]")];
  const observer = new IntersectionObserver(
    (entries) => {
      const visible = entries
        .filter((entry) => entry.isIntersecting)
        .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (!visible) return;
      const id = visible.target.id;
      document.querySelectorAll(".toc a").forEach((link) => {
        link.classList.toggle("active", link.getAttribute("href") === `#${id}`);
      });
    },
    { rootMargin: "-18% 0px -70% 0px", threshold: [0, 0.2, 0.7] }
  );

  state.anchors.forEach((anchor) => observer.observe(anchor));
}

function updateProgress() {
  const scrollable = document.documentElement.scrollHeight - window.innerHeight;
  const progress = scrollable > 0 ? Math.min(100, Math.max(0, (window.scrollY / scrollable) * 100)) : 0;
  els.progress.style.width = `${progress}%`;
  els.progressText.textContent = `${Math.round(progress)}%`;
}

function setStatus(message) {
  els.status.textContent = message;
  els.status.classList.toggle("is-hidden", !message);
}

function labelForType(type) {
  if (type === "module") return "Module";
  if (type === "checklist") return "Checklist";
  return "Phần chính";
}

function shortTitle(text, max = 64) {
  const cleaned = text.replace(/^PHẦN\s+\d+\.\s*/i, "").replace(/^MODULE\s+\d+\.\s*/i, "");
  return cleaned.length > max ? `${cleaned.slice(0, max - 1)}…` : cleaned;
}

function calloutClass(text) {
  if (/không nên|sai|lỗi|vấn đề/i.test(text)) return "warning";
  if (/insight|mục tiêu|định nghĩa|cách tiếp cận/i.test(text)) return "gold";
  return "";
}

function inline(text) {
  return escapeHtml(text)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>");
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function slugify(value) {
  return value
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 80) || "section";
}

function uniqueSlug(value, index) {
  return `${slugify(value)}-${index + 1}`;
}

function makeUnique(base, used) {
  const count = used.get(base) || 0;
  used.set(base, count + 1);
  return count ? `${base}-${count + 1}` : base;
}

function normalizeSearch(value) {
  return value
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d");
}
